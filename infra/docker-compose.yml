# Local development services.
#   docker compose -f infra/docker-compose.yml up -d
# Values below are DEV-ONLY defaults; override them via environment variables (see /.env.example),
# e.g. `docker compose --env-file .env -f infra/docker-compose.yml up -d`.
# Not yet included (later phases): keycloak (Phase 3 OIDC), api and worker containers (Phase 3).
name: ips-generator

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ips-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-ips}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 keeps data under a per-version subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.3
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for original documents (S3 API). Upstream MinIO no longer publishes images
  # (community edition archived 2026); pgsty/minio is a maintained drop-in community build.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ips-dev-access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ips-dev-secret-key}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the documents bucket.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ips-dev-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ips-dev-secret-key}
      S3_BUCKET: ${S3_BUCKET:-ips-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  # FHIR validator with the IPS IG (config in infra/matchbox/application.yaml).
  # First start downloads and installs the IG packages, which takes several minutes.
  matchbox:
    image: europe-west6-docker.pkg.dev/ahdis-ch/ahdis/matchbox:v4.1.21
    ports:
      - "${MATCHBOX_PORT:-8080}:8080"
    volumes:
      - ./matchbox/application.yaml:/config/application.yaml:ro
      - matchbox-data:/database
    mem_limit: ${MATCHBOX_MEMORY_LIMIT:-3g}
    healthcheck:
      # Readiness only reports UP after the IGs are installed.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/matchboxv3/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 900s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  matchbox-data:
